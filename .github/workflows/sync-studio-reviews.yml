name: Sync Studio Reviews

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    # Same shape as Dr. Kaul's project: a handful of sequential scrape
    # attempts per site, cooling down between each, since a single attempt
    # can get capped to a tiny preview by bot detection. Both scripts upsert
    # into the shared `reviews` table keyed on (source, source_review_id),
    # so repeated finds just overwrite harmlessly.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install crawl4ai browser
        run: crawl4ai-setup

      - name: Sync Google reviews (5 attempts, cooling down between each)
        env:
          GOOGLE_MAPS_URL: ${{ secrets.GOOGLE_MAPS_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "=== Google reviews attempt $attempt of 5 ==="
            python scripts/sync_google_reviews.py
            if [ "$attempt" -lt 5 ]; then
              echo "Waiting for the rate-limit signal to reset before the next attempt..."
              sleep 300
            fi
          done

      - name: Sync Trustpilot reviews (3 attempts, cooling down between each)
        env:
          TRUSTPILOT_URL: ${{ secrets.TRUSTPILOT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for attempt in 1 2 3; do
            echo "=== Trustpilot attempt $attempt of 3 ==="
            python scripts/sync_trustpilot_reviews.py
            if [ "$attempt" -lt 3 ]; then
              sleep 120
            fi
          done
